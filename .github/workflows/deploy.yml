# ============================================================================
# OmniVote — CI/CD.
#
#   test   : runs on GitHub-hosted runners. phpunit + React build + Flutter.
#   size   : builds the obfuscated arm64 release APK and fails if it grew past
#            the budget in user-flutter/tool/release_size.sh (students install
#            this on metered connections — see docs/08_BUILD_RELEASE.md).
#   deploy : runs only if `test` + `size` passed AND the push is to main.
#            Uses an ephemeral GitHub-hosted runner with Tailscale OIDC and SSH;
#            no persistent GitHub runner is installed on the production server.
#
# The deploy job joins the tailnet temporarily and invokes the server's
# restricted SSH deploy command. See deploy/README.md -> "Continuous
# deployment" for the one-time setup.
# ============================================================================
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, mbstring, xml, curl, zip, bcmath, intl, gd
          coverage: none

      - name: Install backend dependencies
        working-directory: backend-laravel
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Backend tests
        working-directory: backend-laravel
        # pdo_sqlite is enabled by the `extensions:` list above — no
        # `-d extension=pdo_sqlite.so` here. tests/bootstrap.php aborts the run
        # with a clear message if the extension is ever missing, so a broken
        # provisioning step fails loudly instead of quietly skipping work.
        run: vendor/bin/phpunit

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin-react/package-lock.json

      - name: Admin lint + build
        working-directory: admin-react
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter analyze + test
        working-directory: user-flutter
        run: |
          flutter pub get
          flutter analyze
          flutter test

  size:
    name: Release size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build the obfuscated release APK and enforce the budget
        working-directory: user-flutter
        run: |
          flutter pub get
          chmod +x tool/release_size.sh
          ./tool/release_size.sh build

      - name: Keep the APK (and its symbols) as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omnivote-release-apk-arm64
          path: |
            user-flutter/build/app/outputs/flutter-apk/app-release.apk
            user-flutter/build/symbols/**
          retention-days: 14

  deploy:
    name: Deploy
    needs: [test, size]
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      id-token: write
    steps:
      - name: Connect to the production tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:omnivote-ci
          ping: ${{ vars.DEPLOY_HOST }}

      - name: Invoke the restricted server deploy command
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          : "${DEPLOY_HOST:?Set DEPLOY_HOST in the production environment}"
          : "${DEPLOY_KNOWN_HOSTS:?Set the verified SSH host key in the production environment}"
          : "${DEPLOY_SSH_PRIVATE_KEY:?Set DEPLOY_SSH_PRIVATE_KEY in the production environment}"

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/omnivote_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/omnivote_deploy" "$HOME/.ssh/known_hosts"

          ssh \
            -i "$HOME/.ssh/omnivote_deploy" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            "omnivote-deploy@${DEPLOY_HOST}"
