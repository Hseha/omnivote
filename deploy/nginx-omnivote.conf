# ============================================================================
# OmniVote — nginx server block for the Laravel backend API
# ----------------------------------------------------------------------------
# Drop into /etc/nginx/sites-available/omnivote, then:
#   sudo ln -s /etc/nginx/sites-available/omnivote /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# server_name is set to the Tailscale hostname debian.tail7e9e1e.ts.net.
# Update it if your Tailscale hostname or domain changes.
# ============================================================================

# ---- HTTP : redirect everything to HTTPS -----------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name debian.tail7e9e1e.ts.net;

    # Let's Encrypt webroot hook (only reachable over HTTP if you use http-01)
    location /.well-known/acme-challenge/ {
        root /var/www/omnivote/letsencrypt;
    }

    return 301 https://$host$request_uri;
}

# ---- HTTPS : the actual Laravel API ----------------------------------------
server {
    # NOTE: "listen ... ssl http2" is the syntax nginx 1.24 (Ubuntu 24.04)
    # understands. On nginx >= 1.25.1 it still works (deprecated there, fine).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name debian.tail7e9e1e.ts.net;

    # --- TLS (see "SSL" section of deploy/README.md) ---
    ssl_certificate     /etc/ssl/omnivote/fullchain.pem;
    ssl_certificate_key /etc/ssl/omnivote/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # --- Document root must point at the Laravel "public" folder -----------
    root /var/www/omnivote/backend-laravel/public;
    index index.php;

    # --- Hardening / general ------------------------------------------------
    server_tokens off;
    charset utf-8;
    client_max_body_size 25M;              # registrar CSV / ballot uploads

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # --- Static assets are served directly, everything else -> Laravel ------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # --- PHP files -> php-fpm (FastCGI) -------------------------------------
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # --- Never serve dotfiles (.env, .git, etc.) ----------------------------
    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/omnivote-access.log;
    error_log  /var/log/nginx/omnivote-error.log;
}
