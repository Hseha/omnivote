# ============================================================================
# OmniVote — nginx server block for the Laravel backend API
# ----------------------------------------------------------------------------
# Drop into /etc/nginx/sites-available/omnivote, then:
#   sudo ln -s /etc/nginx/sites-available/omnivote /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# server_name is set to the Tailscale hostname debian.tail7e9e1e.ts.net.
# Update it if your Tailscale hostname or domain changes.
# ============================================================================

# ---- HTTP : redirect everything to HTTPS -----------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name debian.tail7e9e1e.ts.net;

    # Let's Encrypt webroot hook (only reachable over HTTP if you use http-01)
    location /.well-known/acme-challenge/ {
        root /var/www/omnivote/letsencrypt;
    }

    return 301 https://$host$request_uri;
}

# ---- HTTPS : the actual Laravel API ----------------------------------------
server {
    # NOTE: "listen ... ssl http2" is the syntax nginx 1.24 (Ubuntu 24.04)
    # understands. On nginx >= 1.25.1 it still works (deprecated there, fine).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name debian.tail7e9e1e.ts.net;

    # --- TLS (see "SSL" section of deploy/README.md) ---
    ssl_certificate     /etc/ssl/omnivote/fullchain.pem;
    ssl_certificate_key /etc/ssl/omnivote/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # --- Document root must point at the Laravel "public" folder -----------
    root /var/www/omnivote/backend-laravel/public;
    index index.php;

    # --- Hardening / general ------------------------------------------------
    server_tokens off;
    charset utf-8;
    client_max_body_size 25M;              # registrar CSV / ballot uploads

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # HSTS: this vhost is HTTPS-only (port 80 redirects). 1 year, no preload.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # JSON API only, so lock the document policy right down. This governs /,
    # /api/* and everything else; the React console at /admin/ carries its own
    # policy in its own location block below, which is required because nginx
    # does not merge add_header across levels.
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

    # --- React admin console (same-origin SPA) --------------------------------
    # Served from /admin/ so the console shares the API's origin. Sanctum
    # session cookies are SameSite=lax (config/session.php), so a cross-origin
    # console would never send them back. Same-origin also lets
    # src/lib/api.js keep API_BASE_URL empty and stay origin-relative, so there
    # is no VITE_API_BASE_URL / CORS / SANCTUM_STATEFUL_DOMAINS to configure.
    #
    # nginx inherits `add_header` from the enclosing level ONLY while that
    # level declares none of its own. Declaring a CSP here therefore discards
    # every inherited header, so the full set is repeated below on purpose —
    # omitting one would silently drop it for this location only.
    #
    # The API's own `default-src 'none'` policy above is untouched and still
    # governs /api/* and every other path. This block is a sibling of `location
    # /`, so the API is unaffected.
    location = /admin { return 301 /admin/; }

    location /admin/ {
        index index.html;
        # The console has no client-side router, so the SPA shell is the only
        # fallback any path under /admin/ can need.
        try_files $uri $uri/ /admin/index.html;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        # Was `X-SSS-Protection`: a header that does not exist, so the protection
        # this block meant to send was silently absent. Same value as the API
        # block above (line with the server-level add_header) to keep the two
        # vhosts consistent. Note the CSP below — script-src 'self', no
        # unsafe-eval — is what actually stops injection; this auditor header is
        # deprecated (Chrome ignores it) and could be set to "0" on both blocks in
        # a deliberate follow-up, which is a policy change, not a typo fix.
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # Relaxed from the API's default-src 'none' because this is an
        # application, not JSON.
        #   style-src 'unsafe-inline' is REQUIRED: the console sets 23 inline
        #   style attributes, which style-src governs, and the app would render
        #   unstyled without it.
        #   script-src stays 'self' — the built bundle is an external file and
        #   nothing uses dangerouslySetInnerHTML, so no inline script is needed.
        #   connect-src 'self' covers the /api and /sanctum calls.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    }

    # --- Static assets are served directly, everything else -> Laravel ------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # --- PHP files -> php-fpm (FastCGI) -------------------------------------
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        # Forward the real client address so Laravel's trusted-proxy handling
        # (bootstrap/app.php -> trustProxies '127.0.0.1') can apply per-IP login
        # rate limiting instead of collapsing every visitor into one bucket.
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        include fastcgi_params;
    }

    # --- Never serve dotfiles (.env, .git, etc.) ----------------------------
    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/omnivote-access.log;
    error_log  /var/log/nginx/omnivote-error.log;
}
