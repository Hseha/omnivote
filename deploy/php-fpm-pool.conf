; ============================================================================
; OmniVote — php-fpm pool tuning (optional override of the default "www" pool)
; ----------------------------------------------------------------------------
; On Ubuntu the stock pool lives at /etc/php/8.3/fpm/pool.d/www.conf.
; These settings are small, safe tweaks. You can either:
;   a) edit /etc/php/8.3/fpm/pool.d/www.conf directly, or
;   b) drop this file next to it and restart:  sudo systemctl restart php8.3-fpm
; ============================================================================

; --- How many PHP workers to keep alive -------------------------------------
; pm.dynamic starts small and grows under load — the right default for a
; voting app that gets short, sharp traffic spikes during election windows.
pm = dynamic

; Start with a few warm workers...
pm.start_servers = 5

; ...scale up to at most these many under load.
pm.max_children = 50

; Each worker dies after handling this many requests (frees memory leaks).
pm.max_requests = 500

; --- Slow-log so you can find queries that crawl during peak voting ----------
slowlog = /var/log/php8.3-fpm-omnivote-slow.log
request_slowlog_timeout = 10s

; --- Socket must be readable by nginx (www-data on Ubuntu) -------------------
listen = /run/php/php8.3-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; --- Pool user/group ---------------------------------------------------------
user  = www-data
group = www-data
