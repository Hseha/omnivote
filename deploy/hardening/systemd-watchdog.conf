# OmniVote server hardening — systemd runtime watchdog
# (installed at /etc/systemd/system.conf.d/watchdog.conf by deploy/harden-server.sh).
#
# On hardware with a watchdog device (e.g. iTCO_wdt) this makes PID1 pet the
# hardware watchdog; if the system hard-hangs, the watchdog resets the box
# automatically — important for a remote host with no physical access.
[Manager]
RuntimeWatchdogSec=15s
