# OmniVote server hardening — SSH (installed at
# /etc/ssh/sshd_config.d/99-hardening.conf by deploy/harden-server.sh).
#
# Drop-in files are read because the distro's /etc/ssh/sshd_config includes
# /etc/ssh/sshd_config.d/*.conf. Validate with `sshd -t` before reloading.
#
# Key-only auth: the deploy account and operators authenticate with SSH keys.
# Do not enable password auth on an internet-adjacent host.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
X11Forwarding no
