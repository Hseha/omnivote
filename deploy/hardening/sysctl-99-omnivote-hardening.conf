# OmniVote server hardening — kernel/network sysctl
# (installed at /etc/sysctl.d/99-omnivote-hardening.conf by deploy/harden-server.sh).

# Reverse-path filtering in loose mode (required for Tailscale's routing).
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
net.ipv4.conf.tailscale0.rp_filter = 2

# Do not send or accept ICMP redirects / source-routed packets.
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0

# Basic network hygiene.
net.ipv4.tcp_syncookies = 1
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.conf.all.log_martians = 1

# Restrict kernel pointer / dmesg information leakage.
kernel.kptr_restrict = 1
kernel.dmesg_restrict = 1

# Auto-recover from a kernel panic / oops on a remote box with no UPS.
kernel.panic = 10
kernel.panic_on_oops = 1
