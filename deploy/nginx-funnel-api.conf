# Public Tailscale Funnel target: student API and public candidate media only.
# Keep the main nginx vhost and its /admin/ SPA tailnet-only.
server {
    listen 127.0.0.1:8080;
    server_name debian.tail7e9e1e.ts.net;

    root /var/www/omnivote/backend-laravel/public;
    index index.php;
    client_max_body_size 25M;

    location = /api/admin { return 404; }
    location ^~ /api/admin/ { return 404; }

    location /api/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /storage/ {
        try_files $uri =404;
    }

    location = /index.php {
        internal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    location ~ \.php$ { return 404; }
    location / { return 404; }
}
