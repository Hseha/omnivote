# Public Tailscale Funnel target: student API and public candidate media only.
# The main nginx vhost and its /admin/ SPA stay tailnet-only.
#
# Funnel gate: tailscaled sets `Tailscale-Funnel-Request: ?1` on every request
# that arrives via the public Funnel ingress and deletes any client-supplied
# value first (tailscale/tailscale ipn/ipnlocal/serve.go), so public callers
# cannot spoof it away. Plain tailnet `tailscale serve` requests never carry
# it. Keyed on PRESENCE, not value, so a concatenated/duplicate header still
# counts as funnel traffic and fails closed.
map $http_tailscale_funnel_request $funnel_client {
    ""      0;
    default 1;
}

server {
    listen 127.0.0.1:8080;
    server_name debian.tail7e9e1e.ts.net;

    root /var/www/omnivote/backend-laravel/public;
    index index.php;
    client_max_body_size 25M;

    # ---- Admin console: tailnet only -------------------------------------

    location = /admin {
        if ($funnel_client) { return 404; }
        return 301 /admin/;
    }

    location /admin/ {
        if ($funnel_client) { return 404; }

        index index.html;
        try_files $uri $uri/ /admin/index.html;

        # nginx does not merge add_header across levels, and static files
        # bypass Laravel's SecurityHeaders middleware, so the full set from
        # nginx-omnivote.conf's /admin/ block is repeated here on purpose.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    }

    # Health probe used by deploy/README.md smoke checks and CI.
    location = /up {
        if ($funnel_client) { return 404; }
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Sanctum CSRF cookie for the admin SPA login flow.
    location ^~ /sanctum/ {
        if ($funnel_client) { return 404; }
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Admin API (login, 2FA, console). 404 for the public funnel, as before,
    # but reachable for tailnet clients, who are proxied to this vhost too.
    location = /api/admin {
        if ($funnel_client) { return 404; }
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /api/admin/ {
        if ($funnel_client) { return 404; }
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ---- Public: student API + candidate media ----------------------------

    location /api/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /storage/ {
        try_files $uri =404;
    }

    location = /index.php {
        internal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    location ~ \.php$ { return 404; }

    # Never serve dotfiles (.env, .git, etc.).
    location ~ /\.(?!well-known).* { deny all; }

    location / { return 404; }
}
