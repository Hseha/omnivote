# Public Tailscale Funnel target.
#
# The student API + public candidate media are open, and the admin console is
# deliberately reachable here too — but only behind an HTTP Basic pre-auth gate
# (`auth_basic`). The app's own authentication (Sanctum stateful session + TOTP
# 2FA) sits *behind* Basic, so a scanner that finds the URL still has to clear
# Basic before it can even reach the login form.
#
# WHY BASIC: Tailscale Funnel is L4 and does not reliably set X-Forwarded-For,
# so the real client IP is lost (every request appears as loopback). A network
# ACL or per-IP control is therefore useless here; a shared pre-auth secret is
# the only gate that can run before the application.
#
# Create the password file BEFORE reloading (nginx serves 500 for admin paths if
# it is missing):
#   sudo htpasswd -c /etc/nginx/.htpasswd-omnivote omnivote
# Then: sudo nginx -t && sudo systemctl reload nginx
#
# NOTE: the main vhost (deploy/nginx-omnivote.conf) carries the SAME gate for
# tailnet clients. Keep the realm string identical in both files so the browser
# reuses one credential for the console and its same-origin /api/admin XHRs.

server {
    listen 127.0.0.1:8080;
    # __PRIMARY_HOST__ is substituted by deploy/setup-server.sh. It must equal
    # the tailnet name so `tailscale funnel`/`tailscale serve` Host headers match.
    server_name __PRIMARY_HOST__;

    root /var/www/omnivote/backend-laravel/public;
    index index.php;
    client_max_body_size 25M;

    # ---- Admin console: public via Funnel, gated by HTTP Basic ------------

    location = /admin {
        auth_basic "OmniVote Admin";
        auth_basic_user_file /etc/nginx/.htpasswd-omnivote;
        # `return`/`rewrite` run in the rewrite phase, which is BEFORE the access
        # phase where auth_basic is enforced — so a bare `return 301` here would
        # send the redirect without ever prompting for the pre-auth gate.
        # try_files runs in the precontent phase (after auth), so route the
        # trailing-slash redirect through a named location to guarantee the
        # Basic challenge happens first.
        try_files /_admin_redirect_ @admin_redirect;
    }

    location @admin_redirect {
        return 301 /admin/;
    }

    location /admin/ {
        auth_basic "OmniVote Admin";
        auth_basic_user_file /etc/nginx/.htpasswd-omnivote;

        index index.html;
        try_files $uri $uri/ /admin/index.html;

        # nginx does not merge add_header across levels, and static files
        # bypass Laravel's SecurityHeaders middleware, so the full set from
        # nginx-omnivote.conf's /admin/ block is repeated here on purpose.
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        # `same-origin`, not `no-referrer`: Sanctum's stateful-auth check
        # (EnsureFrontendRequestsAreStateful::fromFrontend) keys off the
        # Referer/Origin header, and the browser drops Referer on same-origin
        # calls under "no-referrer" — so the admin SPA's authenticated GETs
        # (2fa/status, /me) got 401 and the login looped. same-origin still
        # hides the referer from every other site.
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    }

    # Health probe used by deploy/README.md smoke checks and CI.
    location = /up {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Sanctum CSRF cookie for the admin SPA login flow. Basic-gated so it is not
    # an open, unauthenticated endpoint on the public internet.
    location ^~ /sanctum/ {
        auth_basic "OmniVote Admin";
        auth_basic_user_file /etc/nginx/.htpasswd-omnivote;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Admin API (login, 2FA, console). Basic-gated like the console itself.
    location = /api/admin {
        auth_basic "OmniVote Admin";
        auth_basic_user_file /etc/nginx/.htpasswd-omnivote;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /api/admin/ {
        auth_basic "OmniVote Admin";
        auth_basic_user_file /etc/nginx/.htpasswd-omnivote;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ---- Public: student API + candidate media ----------------------------

    location /api/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /storage/ {
        try_files $uri =404;
    }

    location = /index.php {
        internal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    location ~ \.php$ { return 404; }

    # Never serve dotfiles (.env, .git, etc.).
    location ~ /\.(?!well-known).* { deny all; }

    location / { return 404; }
}
